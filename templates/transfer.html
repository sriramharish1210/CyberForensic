<!DOCTYPE html>
<html>
<head>
    <title>Transfer Evidence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Transfer Evidence ID: {{ evidence.id }}</h2>

    <form method="POST">
        <select name="new_custodian">
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
        </select>

        <button type="submit">Transfer</button>
    </form>

    <a class="small-link" href="/dashboard">Back to Dashboard</a>
</div>

</body>
</html>
